; Xdebug runtime configuration.
;
; Always loaded but inert until `zend_extension=xdebug` is uncommented in
; docker-php-ext-xdebug.ini (which the runtime entrypoint 01-xdebug.sh does
; when SCAFFOLD_XDEBUG_ENABLED=1). The `xdebug.client_host` is appended by the
; entrypoint at runtime because it has to be detected from inside the
; container — see 01-xdebug.sh.
[xdebug]
xdebug.mode = debug,develop
xdebug.client_port = 9003
; `trigger`, not `yes` — matches Lagoon. With `yes`, Xdebug opens a step-debug
; session on EVERY request; if the IDE holds port 9003 but isn't actively
; driving the session (no "Listen" toggle, wrong path mapping), the request
; blocks forever — Xdebug has no timeout for the post-connect wait
; (xdebug.connect_timeout_ms only covers the TCP connect). With `trigger`,
; debugging activates only when the XDEBUG_TRIGGER env/cookie/GET is present:
;   - CLI/drush: XDEBUG_TRIGGER=cli is set on the app service (see
;     docker-compose.override.yml), so every CLI command debugs automatically.
;   - Web: pass the trigger via a browser extension / XDEBUG_SESSION cookie,
;     so ordinary page loads never hang.
xdebug.start_with_request = trigger
xdebug.discover_client_host = 0
xdebug.idekey = PHPSTORM
