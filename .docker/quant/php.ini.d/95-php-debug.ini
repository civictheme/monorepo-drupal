; DRUPAL_DEBUG-time PHP overrides. Numeric prefix sets load order (95- = late).
;
; Shipped DISABLED by default (directives prefixed with `;`). The runtime
; entrypoint 04-php-debug.sh uncomments them when DRUPAL_DEBUG=1, mirroring how
; 01-xdebug.sh flips docker-php-ext-xdebug.ini. They stay off otherwise.
;
; zend.assertions can't be flipped from a `-1` baseline at runtime via
; ini_set() (PHP silently warns), so we toggle it here at the conf.d layer
; before PHP boots — see 04-php-debug.sh. assert.exception=1 makes a failed
; assert() THROW (so Drupal core's assert() component checks surface as errors)
; rather than emit a warning.
;
; Group future DRUPAL_DEBUG-time php.ini effects under this same file.
;zend.assertions=1
;assert.exception=1
