; App-level PHP overrides. Numeric prefix sets load order (90- = late).
; Tune memory / limits for this project here without touching the base image.
; 768M carried over from the DrevOps stack — content generation (cs_generated_content
; + the civictheme_content_generated_static recipe) needs the headroom.
memory_limit = 768M
upload_max_filesize = 64M
; post_max_size > upload_max_filesize so multipart form overhead doesn't push
; valid uploads over the limit.
post_max_size = 70M
max_execution_time = 120
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; Disable session-based upload progress tracking (carried over from DrevOps).
session.upload_progress.enabled = Off
