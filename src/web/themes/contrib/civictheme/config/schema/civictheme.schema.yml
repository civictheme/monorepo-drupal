# Schema for the configuration files of the CivicTheme theme.

civictheme.settings:
  type: theme_settings
  label: 'CivicTheme settings'
  mapping:
    components:
      type: mapping
      label: 'Components settings'
      mapping:
        logo:
          type: mapping
          label: 'Logo settings'
          mapping:
            primary:
              type: mapping
              label: Primary
              mapping:
                light:
                  type: mapping
                  label: Light
                  mapping:
                    desktop:
                      label: Desktop
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                    mobile:
                      label: Mobile
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                dark:
                  type: mapping
                  label: Dark
                  mapping:
                    desktop:
                      label: Desktop
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                    mobile:
                      label: Mobile
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                image_alt:
                  label: 'Primary logo image "alt" text'
                  type: string
            secondary:
              type: mapping
              label: Secondary
              mapping:
                light:
                  type: mapping
                  label: Light
                  mapping:
                    desktop:
                      label: Desktop
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                    mobile:
                      label: Mobile
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                dark:
                  type: mapping
                  label: Dark
                  mapping:
                    desktop:
                      label: Desktop
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                    mobile:
                      label: Mobile
                      type: mapping
                      mapping:
                        path:
                          label: Path
                          type: string
                image_alt:
                  label: 'Secondary logo image "alt" text'
                  type: string
        header:
          type: mapping
          label: 'Header settings'
          mapping:
            theme:
              label: Theme
              type: string
            logo_type:
              label: 'Logo type'
              type: string
        navigation:
          type: mapping
          label: 'Navigation settings'
          mapping:
            primary_navigation:
              type: mapping
              label: 'Primary navigation settings'
              mapping:
                dropdown:
                  label: 'Dropdown type'
                  type: string
                dropdown_columns:
                  label: 'Number of columns in dropdown'
                  type: integer
                dropdown_columns_fill:
                  label: 'Fill width of the last dropdown row'
                  type: boolean
                is_animated:
                  label: 'Animate transition'
                  type: boolean
            secondary_navigation:
              type: mapping
              label: 'Secondary navigation settings'
              mapping:
                dropdown:
                  label: 'Dropdown type'
                  type: string
                dropdown_columns:
                  label: 'Number of columns in dropdown'
                  type: integer
                dropdown_columns_fill:
                  label: 'Fill width of the last dropdown row'
                  type: boolean
                is_animated:
                  label: 'Animate transition'
                  type: boolean
        footer:
          type: mapping
          label: 'Footer settings'
          mapping:
            theme:
              label: Theme
              type: string
            logo_type:
              label: 'Logo type'
              type: string
            background_image:
              label: 'Footer background image'
              type: mapping
              mapping:
                path:
                  label: 'Footer background image path'
                  type: string
        link:
          type: mapping
          label: 'Link settings'
          mapping:
            new_window:
              label: 'Open all links in the new window'
              type: boolean
            external_new_window:
              label: 'Open external links in the new window'
              type: boolean
            external_override_domains:
              label: 'List of override domains for external links'
              type: sequence
              sequence:
                type: string
        skip_link:
          type: mapping
          label: 'Skip Link settings'
          mapping:
            theme:
              label: Theme
              type: string
        event_card:
          type: mapping
          label: 'Event card settings'
          mapping:
            summary_length:
              label: 'Summary length'
              type: integer
        navigation_card:
          type: mapping
          label: 'Navigation card settings'
          mapping:
            summary_length:
              label: 'Summary length'
              type: integer
        promo_card:
          type: mapping
          label: 'Promo card settings'
          mapping:
            summary_length:
              label: 'Summary length'
              type: integer
        publication_card:
          type: mapping
          label: 'Publication card settings'
          mapping:
            summary_length:
              label: 'Summary length'
              type: integer
            use_media_name:
              label: 'Use name of media'
              type: boolean
        snippet:
          type: mapping
          label: 'Snippet settings'
          mapping:
            summary_length:
              label: 'Summary length'
              type: integer
        attachment:
          type: mapping
          label: 'Attachment settings'
          mapping:
            use_media_name:
              label: 'Use name of media'
              type: boolean
        site_slogan:
          type: mapping
          label: 'Site slogan settings'
          mapping:
            content:
              label: 'Site slogan content'
              type: string
              nullable: true
        search:
          type: mapping
          label: 'Search settings'
          mapping:
            keyword_fields:
              label: 'Keyword fields'
              type: sequence
              sequence:
                type: string
    colors:
      type: mapping
      label: Colors
      mapping:
        use_color_selector:
          label: 'Use Colour Picker'
          type: boolean
        recipe:
          label: 'Colour recipe (JSON) produced by the colour picker'
          type: string
        css:
          label: 'Colour overrides CSS emitted from the recipe'
          type: string
    optouts:
      type: mapping
      label: 'Opt-out flags'

layout_plugin.settings.civictheme_three_columns:
  type: layout_plugin.settings
  label: 'CivicTheme Three Columns Layout Settings'
  mapping:
    is_contained:
      type: boolean
      label: 'Is Contained'
    vertical_spacing:
      type: string
      label: 'Vertical Spacing'
