name: CivicTheme
type: theme
base theme: false
description: CivicTheme is a Drupal component-based theme.
core_version_requirement: ^11.4 || ^12

libraries:
  - 'civictheme/global'
  - 'civictheme/css-variables'

# Suppress core's contextual.module.css — the theme owns these base styles
# via assets/sass/block/_contextual.scss so .contextual-region can be
# wrapped in :where() and stop blocking component positioning.
libraries-override:
  contextual/drupal.contextual-links:
    css:
      component:
        css/contextual.module.css: false

regions:
  header_top_1: 'Header top 1'
  header_top_2: 'Header top 2'
  header_top_3: 'Header top 3'
  header_middle_1: 'Header middle 1'
  header_middle_2: 'Header middle 2'
  header_middle_3: 'Header middle 3'
  header_bottom_1: 'Header bottom 1'
  banner: 'Banner'
  highlighted: 'Highlighted'
  content_top: 'Content Top'
  content: 'Content'
  content_bottom: 'Content Bottom'
  sidebar_top_left: 'Sidebar Top Left'
  sidebar_bottom_left: 'Sidebar Bottom Left'
  sidebar_top_right: 'Sidebar Top Right'
  sidebar_bottom_right: 'Sidebar Bottom Right'
  footer_top_1: 'Footer top 1'
  footer_top_2: 'Footer top 2'
  footer_middle_1: 'Footer middle 1'
  footer_middle_2: 'Footer middle 2'
  footer_middle_3: 'Footer middle 3'
  footer_middle_4: 'Footer middle 4'
  footer_bottom_1: 'Footer bottom 1'
  footer_bottom_2: 'Footer bottom 2'
  hidden: 'Hidden'

features:
  - favicon

ckeditor5-stylesheets:
  - dist/civictheme.editor.css
  - dist/civictheme.variables.css
  # Using colors from the Color Selector is not supported until the issue
  # below is resolved.
  # @see https://www.drupal.org/project/drupal/issues/3406959
  # - /sites/default/files/css-variables.civictheme.css
#;< DEVELOPMENT
# Configuration shipped with this theme.
# Update the list of the configuration below and run `drush cde civictheme`.
# Do not add an empty line before this comment block or the downstream code
# linting will fail on extra blank line.
config_devel:
  install:
    - civictheme.settings
  optional:
    - block.block.civictheme_banner
    - block.block.civictheme_content
    - block.block.civictheme_footer_acknowledgment_of_country
    - block.block.civictheme_footer_copyright
    - block.block.civictheme_footer_menu_1
    - block.block.civictheme_footer_menu_2
    - block.block.civictheme_footer_menu_3
    - block.block.civictheme_footer_menu_4
    - block.block.civictheme_footer_sitebranding
    - block.block.civictheme_footer_social_links
    - block.block.civictheme_header_sitebranding
    - block.block.civictheme_header_sitebranding2
    - block.block.civictheme_help
    - block.block.civictheme_messages
    - block.block.civictheme_mobile_navigation
    - block.block.civictheme_primary_navigation
    - block.block.civictheme_primaryadminactions
    - block.block.civictheme_search
    - block.block.civictheme_secondary_navigation
    - block.block.civictheme_side_navigation
    - block.block.civictheme_signup
    - block.block.civictheme_tabs
#;> DEVELOPMENT
