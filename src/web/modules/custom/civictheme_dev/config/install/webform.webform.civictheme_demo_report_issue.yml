id: civictheme_demo_report_issue
title: 'Report a local issue'
description: '<p>Sample single-page report form. Demonstrates select-driven conditional fields, conditional required contact details, an image upload and a dark-theme container.</p>'
categories: {  }
elements: |-
  introduction:
    '#type': webform_markup
    '#markup': '<p>Report a problem in a public place, such as a pothole, a broken streetlight or graffiti. For emergencies or hazards that put people in danger, call 000.</p>'
  issue_section:
    '#type': webform_section
    '#title': 'The issue'
    '#vertical_spacing': bottom
    issue_type:
      '#type': select
      '#title': 'What type of issue are you reporting?'
      '#options':
        pothole: 'Pothole or road damage'
        streetlight: 'Broken or flickering streetlight'
        graffiti: Graffiti
        waste: 'Dumped rubbish'
        other: 'Something else'
      '#required': true
    streetlight_pole_number:
      '#type': textfield
      '#title': 'Pole number'
      '#description': 'The pole number is printed on a metal plate about 2 metres up the pole.'
      '#states':
        visible:
          ':input[name="issue_type"]':
            value: streetlight
    graffiti_photo:
      '#type': webform_image_file
      '#title': 'Photo of the graffiti'
      '#description': 'A photo helps our crews bring the right equipment.'
      '#states':
        visible:
          ':input[name="issue_type"]':
            value: graffiti
    other_description:
      '#type': textarea
      '#title': 'Describe the issue'
      '#states':
        visible:
          ':input[name="issue_type"]':
            value: other
        required:
          ':input[name="issue_type"]':
            value: other
    issue_location:
      '#type': textfield
      '#title': 'Location of the issue'
      '#description': 'A street address or a nearby landmark, for example "outside 12 Main St" or "playground side of Apex Park".'
      '#required': true
    date_noticed:
      '#type': date
      '#title': 'When did you first notice it?'
      '#date_date_max': today
    urgency:
      '#type': radios
      '#title': 'How urgent is it?'
      '#options':
        low: 'Low — cosmetic or minor'
        medium: 'Medium — getting worse or inconvenient'
        high: 'High — could cause injury or damage'
      '#required': true
  contact_section:
    '#type': webform_section
    '#title': 'Your contact details'
    '#description': '<p>Tell us how to reach you if we need more information about your report.</p>'
    '#description_display': before
    '#vertical_spacing': bottom
    contact_preference:
      '#type': radios
      '#title': 'How would you like to be contacted?'
      '#options':
        email: 'By email'
        phone: 'By phone'
        none: 'I do not want to be contacted'
      '#required': true
    reporter_email:
      '#type': email
      '#title': 'Email address'
      '#states':
        visible:
          ':input[name="contact_preference"]':
            value: email
        required:
          ':input[name="contact_preference"]':
            value: email
    reporter_phone:
      '#type': tel
      '#title': 'Phone number'
      '#states':
        visible:
          ':input[name="contact_preference"]':
            value: phone
        required:
          ':input[name="contact_preference"]':
            value: phone
  updates_container:
    '#type': container
    '#component_theme': dark
    '#with_background': true
    '#is_contained': true
    '#vertical_spacing': both
    subscribe_updates:
      '#type': checkbox
      '#component_theme': dark
      '#title': 'Email me updates about this report'
      '#states':
        visible:
          ':input[name="contact_preference"]':
            value: email
  next_steps_markup:
    '#type': webform_markup
    '#markup': '<p><strong>What happens next?</strong> Reports are triaged every business day. High-urgency issues are inspected within 24 hours. You can see planned works on the council website.</p>'
