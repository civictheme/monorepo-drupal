favicon:
  mimetype: image/vnd.microsoft.icon
  path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/favicon.ico
  use_default: false
features:
  favicon: true
components:
  logo:
    primary:
      light:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_primary_light_desktop.svg
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_primary_light_mobile.svg
      dark:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_primary_dark_desktop.svg
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_primary_dark_mobile.svg
      image_alt: 'CivicTheme government profile'
    secondary:
      light:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_secondary_light_desktop.png
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_secondary_light_mobile.png
      dark:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_secondary_dark_desktop.png
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_government/assets/logos/logo_secondary_dark_mobile.png
      image_alt: 'CivicTheme government profile'
  header:
    theme: dark
    logo_type: inline
  navigation:
    primary_navigation:
      dropdown: drawer
      dropdown_columns: 4
      dropdown_columns_fill: false
      is_animated: true
    secondary_navigation:
      dropdown: dropdown
      dropdown_columns: 4
      dropdown_columns_fill: false
      is_animated: true
  footer:
    theme: dark
    logo_type: inline_stacked
    background_image:
      path: ''
  link:
    new_window: false
    external_new_window: true
    external_override_domains: {  }
  skip_link:
    theme: light
  event_card:
    summary_length: 160
  navigation_card:
    summary_length: 160
  promo_card:
    summary_length: 160
  publication_card:
    summary_length: 160
    use_media_name: true
  snippet:
    summary_length: 160
  attachment:
    use_media_name: true
  site_slogan:
    content: 'A design system by Salsa Digital'
  search:
    keyword_fields: {  }
colors:
  use_color_selector: true
  recipe: |
    {
      "version": 1,
      "brands": {
        "light": {
          "brand1": "#0b66b8",
          "brand2": "#f2f2f2",
          "brand3": "#024d8f"
        },
        "dark": {
          "brand1": "#39aee2",
          "brand2": "#0f305a",
          "brand3": "#e38444"
        }
      },
      "overrides": {
        "color.palette.heading": {
          "light": "#042849",
          "dark": "#f5fafd"
        },
        "color.palette.body": {
          "light": "#34434f",
          "dark": "#e1f2fa"
        },
        "color.palette.background-light": {
          "light": "#fdfdfd",
          "dark": "#1b3a62"
        },
        "color.palette.background": {
          "light": "#f2f2f2",
          "dark": "#0f305a"
        },
        "color.palette.background-dark": {
          "light": "#c1c1c1",
          "dark": "#0a213e"
        },
        "color.palette.border-light": {
          "light": "#b5b5b5",
          "dark": "#abb6c5"
        },
        "color.palette.border": {
          "light": "#606060",
          "dark": "#27446a"
        },
        "color.palette.border-dark": {
          "light": "#181818",
          "dark": "#0a213e"
        },
        "color.palette.interaction-text": {
          "light": "#fcfcfc",
          "dark": "#0f305a"
        },
        "color.palette.interaction-background": {
          "light": "#0b66b8",
          "dark": "#39aee2"
        },
        "color.palette.interaction-hover-text": {
          "light": "#fcfcfc",
          "dark": "#0a213e"
        },
        "color.palette.interaction-hover-background": {
          "light": "#063d6e",
          "dark": "#88ceed"
        },
        "color.palette.interaction-focus": {
          "light": "#8b5cd7",
          "dark": "#8b5cd7"
        },
        "color.palette.highlight": {
          "light": "#024d8f",
          "dark": "#e38444"
        },
        "color.palette.information": {
          "light": "#007cbf",
          "dark": "#4cc4fc"
        },
        "color.palette.warning": {
          "light": "#c95100",
          "dark": "#e38444"
        },
        "color.palette.error": {
          "light": "#ce3836",
          "dark": "#e75653"
        },
        "color.palette.success": {
          "light": "#008482",
          "dark": "#12b0ae"
        }
      }
    }
  css: |
    :root,
    .ct-theme-light {
      --ct-color-heading: #042849;
      --ct-color-body: #34434f;
      --ct-color-background-light: #fdfdfd;
      --ct-color-background: #f2f2f2;
      --ct-color-background-dark: #c1c1c1;
      --ct-color-border-light: #b5b5b5;
      --ct-color-border: #606060;
      --ct-color-border-dark: #181818;
      --ct-color-interaction-text: #fcfcfc;
      --ct-color-interaction-background: #0b66b8;
      --ct-color-interaction-hover-text: #fcfcfc;
      --ct-color-interaction-hover-background: #063d6e;
      --ct-color-highlight: #024d8f;
    }

    .ct-theme-dark {
      --ct-color-heading: #f5fafd;
      --ct-color-body: #e1f2fa;
      --ct-color-background-light: #1b3a62;
      --ct-color-background: #0f305a;
      --ct-color-background-dark: #0a213e;
      --ct-color-border-light: #abb6c5;
      --ct-color-border: #27446a;
      --ct-color-border-dark: #0a213e;
      --ct-color-interaction-text: #0f305a;
      --ct-color-interaction-background: #39aee2;
      --ct-color-interaction-hover-text: #0a213e;
      --ct-color-interaction-hover-background: #88ceed;
      --ct-color-highlight: #e38444;
      --ct-color-error: #e75653;
    }
optouts: {  }
