favicon:
  mimetype: image/vnd.microsoft.icon
  path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/favicon.ico
  use_default: false
features:
  favicon: true
components:
  logo:
    primary:
      light:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_primary_light_desktop.svg
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_primary_light_mobile.svg
      dark:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_primary_dark_desktop.svg
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_primary_dark_mobile.svg
      image_alt: 'CivicTheme higher education profile'
    secondary:
      light:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_secondary_light_desktop.png
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_secondary_light_mobile.png
      dark:
        desktop:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_secondary_dark_desktop.png
        mobile:
          path: modules/custom/civictheme_content/modules/civictheme_content_highereducation/assets/logos/logo_secondary_dark_mobile.png
      image_alt: 'CivicTheme higher education profile'
  header:
    theme: light
    logo_type: inline
  navigation:
    primary_navigation:
      dropdown: drawer
      dropdown_columns: 4
      dropdown_columns_fill: false
      is_animated: true
    secondary_navigation:
      dropdown: dropdown
      dropdown_columns: 4
      dropdown_columns_fill: false
      is_animated: true
  footer:
    theme: dark
    logo_type: inline_stacked
    background_image:
      path: ''
  link:
    new_window: false
    external_new_window: true
    external_override_domains: {  }
  skip_link:
    theme: light
  event_card:
    summary_length: 160
  navigation_card:
    summary_length: 160
  promo_card:
    summary_length: 160
  publication_card:
    summary_length: 160
    use_media_name: true
  snippet:
    summary_length: 160
  attachment:
    use_media_name: true
  site_slogan:
    content: 'A design system by Salsa Digital'
  search:
    keyword_fields: {  }
colors:
  use_color_selector: true
  recipe: |
    {
      "version": 1,
      "brands": {
        "light": {
          "brand1": "#088183",
          "brand2": "#eeeeee",
          "brand3": "#1ba593"
        },
        "dark": {
          "brand1": "#11ceb5",
          "brand2": "#004b51",
          "brand3": "#28ccff"
        }
      },
      "overrides": {
        "color.palette.heading": {
          "light": "#033334",
          "dark": "#f3fcfb"
        },
        "color.palette.body": {
          "light": "#334747",
          "dark": "#dbf7f3"
        },
        "color.palette.background-light": {
          "light": "#fdfdfd",
          "dark": "#0c5459"
        },
        "color.palette.background": {
          "light": "#eeeeee",
          "dark": "#004b51"
        },
        "color.palette.background-dark": {
          "light": "#bebebe",
          "dark": "#003438"
        },
        "color.palette.border-light": {
          "light": "#b2b2b2",
          "dark": "#a5c0c2"
        },
        "color.palette.border": {
          "light": "#5f5f5f",
          "dark": "#195d62"
        },
        "color.palette.border-dark": {
          "light": "#171717",
          "dark": "#003438"
        },
        "color.palette.interaction-text": {
          "light": "#fbfbfb",
          "dark": "#004b51"
        },
        "color.palette.interaction-background": {
          "light": "#088183",
          "dark": "#11ceb5"
        },
        "color.palette.interaction-hover-text": {
          "light": "#fbfbfb",
          "dark": "#003438"
        },
        "color.palette.interaction-hover-background": {
          "light": "#044d4e",
          "dark": "#70e1d2"
        },
        "color.palette.interaction-focus": {
          "light": "#8b5cd7",
          "dark": "#8b5cd7"
        },
        "color.palette.highlight": {
          "light": "#1da593",
          "dark": "#29ccff"
        },
        "color.palette.information": {
          "light": "#007cbf",
          "dark": "#4cc4fc"
        },
        "color.palette.warning": {
          "light": "#f5ae5c",
          "dark": "#e38444"
        },
        "color.palette.error": {
          "light": "#ed6b5e",
          "dark": "#e85653"
        },
        "color.palette.success": {
          "light": "#1ea593",
          "dark": "#12b0ae"
        }
      }
    }
  css: |
    :root,
    .ct-theme-light {
      --ct-color-heading: #033334;
      --ct-color-body: #334747;
      --ct-color-background-light: #fdfdfd;
      --ct-color-background: #eeeeee;
      --ct-color-background-dark: #bebebe;
      --ct-color-border-light: #b2b2b2;
      --ct-color-border: #5f5f5f;
      --ct-color-border-dark: #171717;
      --ct-color-interaction-text: #fbfbfb;
      --ct-color-interaction-background: #088183;
      --ct-color-interaction-hover-text: #fbfbfb;
      --ct-color-interaction-hover-background: #044d4e;
      --ct-color-highlight: #1da593;
      --ct-color-warning: #f5ae5c;
      --ct-color-error: #ed6b5e;
      --ct-color-success: #1ea593;
    }

    .ct-theme-dark {
      --ct-color-heading: #f3fcfb;
      --ct-color-body: #dbf7f3;
      --ct-color-background-light: #0c5459;
      --ct-color-background: #004b51;
      --ct-color-background-dark: #003438;
      --ct-color-border-light: #a5c0c2;
      --ct-color-border: #195d62;
      --ct-color-border-dark: #003438;
      --ct-color-interaction-text: #004b51;
      --ct-color-interaction-background: #11ceb5;
      --ct-color-interaction-hover-text: #003438;
      --ct-color-interaction-hover-background: #70e1d2;
      --ct-color-highlight: #29ccff;
    }
optouts: {  }
