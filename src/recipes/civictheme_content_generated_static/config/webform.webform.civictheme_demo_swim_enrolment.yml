id: civictheme_demo_swim_enrolment
title: 'Enrol in a swimming program'
description: '<p>Sample two-page wizard form. Demonstrates the progress tracker, conditional medical details, a returning-member conditional, fieldsets and section spacing.</p>'
categories: {  }
elements: |-
  page_participant:
    '#type': webform_wizard_page
    '#title': 'Participant details'
    participant_section:
      '#type': webform_section
      '#title': 'About the participant'
      '#vertical_spacing': bottom
      participant_name:
        '#type': webform_name
        '#title': 'Participant name'
        '#required': true
      participant_dob:
        '#type': date
        '#title': 'Date of birth'
        '#date_date_max': today
        '#required': true
      returning_member:
        '#type': radios
        '#title': 'Has the participant enrolled in one of our programs before?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#required': true
      member_number:
        '#type': textfield
        '#title': 'Member number'
        '#description': 'Found on previous enrolment confirmations, for example SW-12345.'
        '#pattern': 'SW-[0-9]{5}'
        '#pattern_error': 'Enter your member number in the format SW-12345.'
        '#states':
          visible:
            ':input[name="returning_member"]':
              value: 'yes'
    medical_section:
      '#type': webform_section
      '#title': 'Medical information'
      '#description': '<p>This information is shared with instructors and lifeguards on duty during program sessions.</p>'
      '#description_display': before
      '#vertical_spacing': bottom
      has_medical_condition:
        '#type': radios
        '#title': 'Does the participant have a medical condition, allergy or disability we should know about?'
        '#options':
          'yes': 'Yes'
          'no': 'No'
        '#required': true
      medical_details:
        '#type': textarea
        '#title': 'Medical details'
        '#description': 'Include any medication, management plans, or support the participant needs.'
        '#states':
          visible:
            ':input[name="has_medical_condition"]':
              value: 'yes'
          required:
            ':input[name="has_medical_condition"]':
              value: 'yes'
  page_program:
    '#type': webform_wizard_page
    '#title': 'Program and contacts'
    program_section:
      '#type': webform_section
      '#title': 'Program selection'
      '#vertical_spacing': bottom
      program_level:
        '#type': radios
        '#title': 'Program level'
        '#options':
          learn: 'Learn to swim (beginners)'
          stroke: 'Stroke development (intermediate)'
          squad: 'Squad training (advanced)'
        '#required': true
      squad_tryout_acknowledgement:
        '#type': checkbox
        '#title': 'I understand squad placement requires a tryout assessment'
        '#states':
          visible:
            ':input[name="program_level"]':
              value: squad
          required:
            ':input[name="program_level"]':
              value: squad
      preferred_day:
        '#type': select
        '#title': 'Preferred day'
        '#options':
          monday: Monday
          wednesday: Wednesday
          saturday: Saturday
        '#required': true
      preferred_time:
        '#type': radios
        '#title': 'Preferred time'
        '#options':
          morning: 'Morning (6am – 9am)'
          afternoon: 'Afternoon (4pm – 6pm)'
        '#required': true
    emergency_fieldset:
      '#type': fieldset
      '#title': 'Emergency contact'
      '#description': 'Someone we can call during sessions if the participant needs help.'
      emergency_name:
        '#type': textfield
        '#title': 'Emergency contact name'
        '#required': true
      emergency_phone:
        '#type': tel
        '#title': 'Emergency contact phone'
        '#required': true
      emergency_relationship:
        '#type': textfield
        '#title': 'Relationship to participant'
    enrolment_email:
      '#type': email
      '#title': 'Email for enrolment confirmation'
      '#required': true
