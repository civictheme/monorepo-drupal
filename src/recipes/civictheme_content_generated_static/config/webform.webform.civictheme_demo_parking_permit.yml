id: civictheme_demo_parking_permit
title: 'Apply for a resident parking permit'
description: '<p>Sample single-page application form. Demonstrates sections with vertical spacing, fieldsets, conditional visibility/required states, pattern validation, a file upload and AJAX submission.</p>'
categories: {  }
elements: |-
  introduction:
    '#type': webform_markup
    '#markup': '<p>Use this form to apply for a resident parking permit. You must live at the address you are applying for. Applications are processed within 10 business days.</p>'
  your_details_section:
    '#type': webform_section
    '#title': 'Your details'
    '#description': '<p>We use these details to confirm your eligibility and to contact you about your application.</p>'
    '#description_display': before
    '#vertical_spacing': bottom
    applicant_name:
      '#type': webform_name
      '#title': 'Full name'
      '#required': true
    date_of_birth:
      '#type': date
      '#title': 'Date of birth'
      '#date_date_max': today
      '#required': true
    contact_email:
      '#type': email
      '#title': 'Email address'
      '#description': 'We will send your permit confirmation to this address.'
      '#required': true
    contact_phone:
      '#type': tel
      '#title': 'Phone number'
      '#help': '<p>Include the area code, for example 02 5550 1234.</p>'
      '#help_title': 'Phone number help'
  residential_address_section:
    '#type': webform_section
    '#title': 'Residential address'
    '#description': '<p>The permit applies only to the street address where you live.</p>'
    '#description_display': before
    '#vertical_spacing': bottom
    residential_address:
      '#type': webform_address
      '#title': 'Street address'
      '#required': true
    proof_of_residence:
      '#type': webform_document_file
      '#title': 'Proof of residence'
      '#description': 'Upload a rates notice, lease agreement or utility bill issued in the last 3 months.'
  vehicle_section:
    '#type': webform_section
    '#title': 'Vehicle details'
    '#vertical_spacing': bottom
    number_of_vehicles:
      '#type': radios
      '#title': 'How many vehicles are you registering?'
      '#options':
        one: 'One vehicle'
        two: 'Two vehicles'
      '#required': true
    vehicle_one_fieldset:
      '#type': fieldset
      '#title': 'Vehicle 1'
      vehicle_one_plate:
        '#type': textfield
        '#title': 'Registration plate'
        '#pattern': '[A-Za-z0-9 -]{1,9}'
        '#pattern_error': 'Enter a valid registration plate using letters, numbers, spaces or hyphens (up to 9 characters).'
        '#required': true
      vehicle_one_type:
        '#type': select
        '#title': 'Vehicle type'
        '#options':
          sedan: 'Sedan or hatchback'
          suv: 'SUV or 4WD'
          van: 'Van or ute'
          motorcycle: Motorcycle
        '#required': true
    vehicle_two_fieldset:
      '#type': fieldset
      '#title': 'Vehicle 2'
      '#states':
        visible:
          ':input[name="number_of_vehicles"]':
            value: two
      vehicle_two_plate:
        '#type': textfield
        '#title': 'Registration plate (second vehicle)'
        '#pattern': '[A-Za-z0-9 -]{1,9}'
        '#pattern_error': 'Enter a valid registration plate using letters, numbers, spaces or hyphens (up to 9 characters).'
        '#states':
          required:
            ':input[name="number_of_vehicles"]':
              value: two
      vehicle_two_type:
        '#type': select
        '#title': 'Vehicle type (second vehicle)'
        '#options':
          sedan: 'Sedan or hatchback'
          suv: 'SUV or 4WD'
          van: 'Van or ute'
          motorcycle: Motorcycle
        '#states':
          required:
            ':input[name="number_of_vehicles"]':
              value: two
  declaration_container:
    '#type': container
    '#with_background': true
    '#is_contained': true
    '#vertical_spacing': both
    declaration_statement:
      '#type': webform_markup
      '#markup': '<p>By submitting this application you declare that the information provided is true and correct, and that the nominated vehicles are registered at your residential address.</p>'
  declaration:
    '#type': checkbox
    '#title': 'I declare the information provided is true and correct'
    '#required': true
    '#required_error': 'You must agree to the declaration before submitting your application.'
