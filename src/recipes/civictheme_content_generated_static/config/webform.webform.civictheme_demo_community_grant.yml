id: civictheme_demo_community_grant
title: 'Apply for a community grant'
description: '<p>Sample three-page wizard form. Demonstrates the progress tracker, OR-condition conditional fields, word-count validation, number min/max, date minimum, a document upload and a computed review page.</p>'
categories: {  }
elements: |-
  page_organisation:
    '#type': webform_wizard_page
    '#title': 'Organisation details'
    organisation_intro:
      '#type': webform_markup
      '#markup': '<p>Grants of between $500 and $20,000 are available to not-for-profit community organisations. Have your organisation details and a project budget ready before you start.</p>'
    organisation_name:
      '#type': textfield
      '#title': 'Organisation name'
      '#required': true
    organisation_type:
      '#type': select
      '#title': 'Organisation type'
      '#options':
        incorporated: 'Incorporated association'
        charity: 'Registered charity'
        company: 'Company limited by guarantee'
        unincorporated: 'Unincorporated community group'
      '#required': true
    organisation_abn:
      '#type': textfield
      '#title': 'ABN'
      '#description': 'Your 11-digit Australian Business Number, without spaces.'
      '#pattern': '[0-9]{11}'
      '#pattern_error': 'Enter your ABN as 11 digits with no spaces.'
      '#states':
        visible:
          - ':input[name="organisation_type"]':
              value: charity
          - or
          - ':input[name="organisation_type"]':
              value: company
        required:
          - ':input[name="organisation_type"]':
              value: charity
          - or
          - ':input[name="organisation_type"]':
              value: company
    auspice_fieldset:
      '#type': fieldset
      '#title': 'Auspicing organisation'
      '#description': 'Unincorporated groups must be auspiced by an incorporated organisation that will administer the funds.'
      '#states':
        visible:
          ':input[name="organisation_type"]':
            value: unincorporated
      auspice_name:
        '#type': textfield
        '#title': 'Auspicing organisation name'
        '#states':
          required:
            ':input[name="organisation_type"]':
              value: unincorporated
      auspice_contact_email:
        '#type': email
        '#title': 'Auspicing organisation contact email'
        '#states':
          required:
            ':input[name="organisation_type"]':
              value: unincorporated
    contact_section:
      '#type': webform_section
      '#title': 'Contact person'
      '#vertical_spacing': top
      applicant_email:
        '#type': webform_email_confirm
        '#title': 'Contact email'
        '#confirm__title': 'Confirm contact email'
        '#required': true
      applicant_phone:
        '#type': tel
        '#title': 'Contact phone'
        '#required': true
  page_project:
    '#type': webform_wizard_page
    '#title': 'Project details'
    project_title:
      '#type': textfield
      '#title': 'Project title'
      '#required': true
    project_summary:
      '#type': textarea
      '#title': 'Project summary'
      '#description': 'Describe what the project will deliver and who will benefit, in no more than 200 words.'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 200
      '#counter_maximum_message': 'Keep your summary to @limit words or fewer.'
    amount_requested:
      '#type': number
      '#title': 'Amount requested'
      '#description': 'Between $500 and $20,000. Whole dollars only.'
      '#field_prefix': '$'
      '#min': 500
      '#max': 20000
      '#step': 1
      '#required': true
    project_start_date:
      '#type': date
      '#title': 'Project start date'
      '#description': 'Projects must start after the funding round closes.'
      '#date_date_min': today
      '#required': true
    project_budget:
      '#type': webform_document_file
      '#title': 'Project budget'
      '#description': 'Upload an itemised budget as a document or spreadsheet.'
      '#required': true
  page_review:
    '#type': webform_wizard_page
    '#title': 'Review and declare'
    review_summary:
      '#type': webform_computed_twig
      '#title': 'Your application'
      '#template': |-
        <dl>
          <dt>Organisation</dt><dd>{{ data.organisation_name }}</dd>
          <dt>Project</dt><dd>{{ data.project_title }}</dd>
          <dt>Amount requested</dt><dd>${{ data.amount_requested }}</dd>
        </dl>
    funding_note_container:
      '#type': container
      '#with_background': true
      '#is_contained': true
      '#vertical_spacing': both
      funding_note:
        '#type': webform_markup
        '#markup': '<p>Check your application carefully before submitting — you cannot change it after submission. Late or incomplete applications are not assessed.</p>'
    declaration_container:
      '#type': container
      '#vertical_spacing': top
      grant_terms:
        '#type': webform_terms_of_service
        '#terms_title': 'Grant funding conditions'
        '#terms_content': '<p>Successful applicants must spend funds as described in their application, acknowledge council support in project materials, and submit an acquittal report within 60 days of project completion.</p>'
        '#required': true
      declaration:
        '#type': checkbox
        '#title': 'I am authorised to apply on behalf of this organisation and the information provided is true and correct'
        '#required': true
        '#required_error': 'You must confirm you are authorised to apply and the information is correct.'
