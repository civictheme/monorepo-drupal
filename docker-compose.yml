# Loose wrapper around docker compose. All runtime services live here.
# No Lagoon-tagged images — Salsa Hosting devops policy. Only the app uses a Salsa Hosting image;
# everything else is upstream public.
#
# Optional services (redis, solr, clamav) ship commented out. See the note above
# each block before enabling one.
x-quant-labels:
  # ARM64 or X86_64. MUST match `platforms:` in
  # .github/workflows/build-deploy.yml — that workflow builds the image, this
  # label tells Salsa Hosting what to run it on. Nothing enforces the pair, and
  # a mismatch surfaces as a runtime failure on the platform rather than a build
  # error. Change both together.
  quant.architecture: "ARM64"

services:

  app:
    build:
      context: .
      dockerfile: .docker/drupal/Dockerfile
      args:
        # 8.4 is the deployed (Drupal 11) stack. GovCMS variants run the same
        # 8.4 image — govcms/govcms 4.6+/dev-4.x-develop requires php ^8.4.0
        # (the 8.3 platform line ended with GovCMS 4.5.x, 2026-10). The arg
        # stays as the knob for testing against another platform PHP; a
        # different value is best run as a second stack
        # (SCAFFOLD_PROJECT=<name>--other) so switching variants doesn't
        # rebuild the image every time.
        PHP_VERSION: "${PHP_VERSION:-8.4}"
        # Optional: passes through to `composer install` during the image build.
        # Empty value = anonymous / rate-limited. See .env.example.
        GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      - "8080:80"
    volumes:
      - app-files:/opt/drupal/web/sites/default/files
      # Private files OUTSIDE the docroot — Quant's Drupal guidance warns
      # against the scaffold default of sites/default/files/private (inside
      # the public tree). settings.php reads DRUPAL_PRIVATE_FILES below.
      - app-private:/opt/drupal/private
    environment:
      DRUPAL_PRIVATE_FILES: /opt/drupal/private
    # DB env vars supplied by Salsa Hosting in production, or by docker-compose.override.yml locally.

  db:
    image: mysql:8.4
    volumes:
      - db_data:/var/lib/mysql
    labels:
      quant.type: mysql
    command:
      - --mysql-native-password=ON

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL SERVICES — Redis, Solr, ClamAV
#
# Do NOT uncomment these unless it has been discussed with DevOps first.
#
# Salsa Hosting has to enable the matching environment-service on the target
# environment. Enabling a service only here makes local and deployed behaviour
# diverge silently: the site works on your machine and fails after deploy.
#
# Once agreed with DevOps:
#   1. Uncomment the service block below, and its volume at the end of this file.
#   2. Mirror any local-only settings (ports, etc.) in docker-compose.override.yml.
#   3. Add the service to the `environment-services` input in
#      .github/workflows/delete-environment.yml.
#   4. For Redis, also set DRUPAL_REDIS_ENABLED=1 and DRUPAL_REDIS_HOST in .env.
#   5. Run `ahoy build`.
#
# The definitions are kept here rather than deleted so that enabling one is an
# uncomment, not a research exercise.
# ─────────────────────────────────────────────────────────────────────────────

#  redis:
#    image: redis:8-alpine
#    labels:
#      quant.type: environment-service

#  solr:
#    image: solr:9
#    volumes:
#      - solr:/var/solr
#    labels:
#      quant.type: environment-service
#    command:
#      - solr-precreate
#      - drupal

#  clamav:
#    image: clamav/clamav:stable
#    labels:
#      quant.type: environment-service
#    volumes:
#      - clamav_data:/var/lib/clamav

# ─────────────────────────── end optional services ───────────────────────────

# No front-end build worker here, on purpose.
#
# The normal workflow is npm on your own machine:
#
#   cd src/web/themes/custom/mytheme && npm install && npm run build
#
# src/ is bind-mounted, so the output is live immediately. Watch mode in
# particular belongs on the host — file-change events do not propagate reliably
# across bind mounts.
#
# If you would rather not install node, `ahoy fe-build` runs the Dockerfile's
# own `assets` stage and writes its output onto your disk. That is deliberately
# the same stage the deployed image uses: a sidecar here would be a SECOND
# definition of how the front end is built, and the one that ships to production
# would be the other one. See docs/frontend.md.

  # Selenium for Behat browser tests (`ahoy test-behat`). Local-only —
  # quant.type=none means Salsa Hosting won't deploy this service.
  chrome:
    image: selenium/standalone-chrome:4
    shm_size: 1gb
    labels:
      quant.type: none
    profiles:
      - test

volumes:
  app-files: {}
  app-private: {}
  db_data: {}
# Uncomment alongside the matching optional service above.
#  solr: {}
#  clamav_data: {}
