name: Scaffold CI

# Conversion-branch CI for the Salsa Hosting scaffold stack: proves the
# deployed image builds (assets + sub-theme stages included) and that the
# local stack builds, provisions and serves a site on a plain GitHub runner.
# The full CircleCI-parity pipeline lands in Phase 3; this is the smoke
# signal for Phases 1–2.
'on':
  push:
    branches:
      - feature/salsa-hosting-scaffold

concurrency:
  group: scaffold-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  image:
    name: Deployed image builds (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build deployed image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.docker/drupal/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            GITHUB_TOKEN=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: Local stack provisions (minimal + sub-theme)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare environment
        run: |
          cp .env.example .env
          # The committed override joins pygmy's shared bridge; it does not
          # exist on a fresh runner.
          docker network create amazeeio-network

      - name: Build stack and provision
        env:
          DRUPAL_INSTALL_PROFILE: minimal
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/custom/build-variant.sh

      - name: Smoke test site
        run: |
          set -eux
          port=$(docker compose port app 80 | cut -d: -f2)
          curl -sSf -o /tmp/home.html "http://localhost:${port}/"
          grep -qi civictheme /tmp/home.html
          scripts/quant/exec.sh /opt/drupal/bin/drush status --field=bootstrap | grep -qi success

      - name: Unit tests
        run: scripts/quant/exec.sh bin/phpunit --testsuite=unit

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
