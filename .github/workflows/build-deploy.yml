name: Build and Push civictheme-monorepo-drupal to Quant Cloud
'on':
  push:
    branches:
    - main
    - master
    - develop
    - quant-cloud-migration
    - release/*
    - hotfix/*
    - feature/editorial-*
    - feature/salsa-hosting-scaffold
    - project/*
    tags:
    - '*'

# Checkout needs contents, the CI gate reads workflow runs; the Quant actions
# and the gha build cache authenticate with their own credentials.
permissions:
  contents: read
  actions: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    steps:

    # Deploys of refs that feed real sites wait for the commit's CI run:
    # develop also redeploys the three content environments and production
    # reinstalls from profile on deploy, so a red commit takes sites down.
    # Preview branches (feature/release/hotfix/project) deploy immediately —
    # fast iteration on a broken branch is what their environments are for.
    - name: Wait for CI to pass on this commit
      if: >-
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/')
      timeout-minutes: 60
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Waiting for the CI workflow run on ${GITHUB_SHA}…"
        while :; do
          json="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow=CI --commit "${GITHUB_SHA}" --limit 1 --json status,conclusion)"
          status="$(jq -r '.[0].status // "pending"' <<<"${json}")"
          conclusion="$(jq -r '.[0].conclusion // ""' <<<"${json}")"
          if [ "${status}" = "completed" ]; then
            if [ "${conclusion}" = "success" ]; then
              echo "CI passed."
              break
            fi
            echo "::error::CI concluded '${conclusion}' on this commit — refusing to deploy. Re-run this workflow once CI is green."
            exit 1
          fi
          echo "CI is ${status}…"
          sleep 30
        done

    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Initialize Quant Cloud
      uses: quantcdn/quant-cloud-init-action@v4
      id: init
      with:
        quant_organization: ${{ secrets.QUANT_ORGANIZATION }}
        quant_api_key: ${{ secrets.QUANT_API_KEY }}
        quant_application: civictheme-monorepo-drupal
        master_branch_override: main

    - name: Override outputs for special branches
      id: override-outputs
      run: |-
        echo "image_suffix=${{ steps.init.outputs.image_suffix }}" >> $GITHUB_OUTPUT
        # Remove leading hyphen from image_suffix for image_suffix parameter
        suffix="${{ steps.init.outputs.image_suffix }}"
        clean_suffix="${suffix#-}"
        echo "image_suffix_clean=$clean_suffix" >> $GITHUB_OUTPUT
        echo "is_production=${{ steps.init.outputs.is_production }}" >> $GITHUB_OUTPUT
        echo "environment_name=${{ steps.init.outputs.environment_name }}" >> $GITHUB_OUTPUT
        echo "environment_exists=${{ steps.init.outputs.environment_exists }}" >> $GITHUB_OUTPUT

    # Single app image (apache-php) — the scaffold topology. The assets and
    # sub-theme stages inside the Dockerfile bake the built CivicTheme
    # front-end and the generated civictheme_demo sub-theme, so the platform
    # never runs composer or npm.
    - name: Build and push app image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./.docker/drupal/Dockerfile
        platforms: linux/arm64
        push: true
        tags: ${{ steps.init.outputs.stripped_endpoint }}/${{ secrets.QUANT_ORGANIZATION }}/${{ steps.init.outputs.quant_application
          }}:app${{ steps.override-outputs.outputs.image_suffix }}
        cache-from: |-
          type=gha
          type=registry,ref=${{ steps.init.outputs.stripped_endpoint }}/${{ secrets.QUANT_ORGANIZATION }}/${{ steps.init.outputs.quant_application }}:app-cache
        cache-to: type=gha,mode=max

    # A redeploy alone never reads docker-compose.yml — compose changes
    # (volumes, labels, service shape) only propagate through the compose
    # action feeding the environment action.
    - name: Translate compose definition
      id: compose
      uses: quantcdn/quant-cloud-compose-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        compose_file: docker-compose.yml
        image_suffix: ${{ steps.override-outputs.outputs.image_suffix_clean }}

    - name: Create environment if it doesn't exist
      if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.override-outputs.outputs.environment_exists == 'false' }}
      uses: quantcdn/quant-cloud-environment-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        app_name: ${{ steps.init.outputs.quant_application }}
        environment_name: ${{ steps.override-outputs.outputs.environment_name }}
        from_environment: production
        compose_spec: ${{ steps.compose.outputs.translated_compose }}
        image_suffix: ${{ steps.override-outputs.outputs.image_suffix_clean }}

    - name: Update existing environment from compose
      if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.override-outputs.outputs.environment_exists == 'true' }}
      uses: quantcdn/quant-cloud-environment-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        app_name: ${{ steps.init.outputs.quant_application }}
        environment_name: ${{ steps.override-outputs.outputs.environment_name }}
        operation: update
        compose_spec: ${{ steps.compose.outputs.translated_compose }}
        image_suffix: ${{ steps.override-outputs.outputs.image_suffix_clean }}

    - name: Redeploy existing environment
      if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.override-outputs.outputs.environment_exists == 'true' }}
      uses: quantcdn/quant-cloud-environment-state-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        application: ${{ steps.init.outputs.quant_application }}
        environment: ${{ steps.override-outputs.outputs.environment_name }}
        action: redeploy

    # TODO(Phase 2 — §6.4 of the conversion plan): CI-driven provisioning.
    # After the redeploy, every environment flagged for reinstall (production
    # included — the demo sites reinstall from profile on each deploy by
    # design) gets a full provision via a one-off exec against the
    # environment's NEW image:
    #   1. Wait for the rollout to finish (poll environment state / the
    #      deployments API) — the actions above request a deploy and return
    #      without waiting, so an immediate exec would provision the OLD image.
    #   2. Run scripts/quant/provision.sh via the platform's one-off exec
    #      (temporary container from the environment's image with its
    #      variables and volumes).
    # Production guards (no admin unblock, no sanitize) live in the provision
    # scripts, keyed on QUANT_ENV_TYPE. Blocked on confirming the qc CLI
    # exec interface with DevOps.

    # Content environments (corporate / government / highereducation) are
    # env-var-only Quant environments running the develop image; develop's
    # deploy triggers their redeploy so they pick up each new image.
    - name: Redeploy content environments
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: quantcdn/quant-cloud-environment-state-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        application: ${{ steps.init.outputs.quant_application }}
        environment: content-corporate
        action: redeploy
      continue-on-error: true

    - name: Redeploy content environment (government)
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: quantcdn/quant-cloud-environment-state-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        application: ${{ steps.init.outputs.quant_application }}
        environment: content-government
        action: redeploy
      continue-on-error: true

    - name: Redeploy content environment (highereducation)
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: quantcdn/quant-cloud-environment-state-action@v4
      with:
        api_key: ${{ secrets.QUANT_API_KEY }}
        organization: ${{ secrets.QUANT_ORGANIZATION }}
        application: ${{ steps.init.outputs.quant_application }}
        environment: content-highereducation
        action: redeploy
      continue-on-error: true
